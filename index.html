<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Games</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='14' height='9' rx='2' fill='%23c9a45c'/%3E%3Crect x='3' y='6' width='2' height='2' fill='%230f2219'/%3E%3Crect x='7' y='6' width='2' height='2' fill='%230f2219'/%3E%3Crect x='11' y='6' width='2' height='2' fill='%230f2219'/%3E%3Crect x='4' y='9' width='8' height='2' fill='%230f2219'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #12101a;
        --card: #1d1a28;
        --edge: #34304a;
        --text: #f3eee4;
        --dim: #a49db6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, sans-serif;
        display: grid;
        place-content: center;
        gap: 28px;
        padding: 24px 16px;
      }
      h1 {
        margin: 0;
        text-align: center;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .games {
        width: min(720px, calc(100vw - 32px));
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 340px));
        justify-content: center;
        gap: 20px;
      }
      a {
        display: block;
        color: inherit;
        text-decoration: none;
        background: var(--card);
        border: 1px solid var(--edge);
        border-radius: 14px;
        overflow: hidden;
        transition: transform 0.12s, border-color 0.12s;
      }
      a:hover,
      a:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent);
        outline: none;
      }
      .art {
        height: 150px;
        display: grid;
        place-items: center;
        font-size: 30px;
      }
      .balloon {
        --accent: #ffcd75;
      }
      .balloon .art {
        background: linear-gradient(#5d275d, #b13e53 60%, #ef7d57);
        font: 700 30px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.08em;
        color: #ffcd75;
        text-shadow: 3px 3px 0 #29366f;
        image-rendering: pixelated;
      }
      .fresh {
        --accent: #c9a45c;
      }
      .fresh .art {
        background: radial-gradient(circle at 50% 40%, #2d4a35, #0f2219 70%);
        font: italic 600 34px/1 "Iowan Old Style", Palatino, Georgia, serif;
        color: #fbe7b0;
      }
      .about {
        padding: 14px 18px 18px;
      }
      .about strong {
        display: block;
        font-size: 18px;
      }
      .about span {
        color: var(--dim);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Typing Games</h1>
    <div class="games">
      <a class="balloon" href="balloon-pop/">
        <div class="art">BALLOON POP</div>
        <div class="about"><strong>Balloon Pop</strong><span>Pop the balloons over a pixel city before they float away.</span></div>
      </a>
      <a class="fresh" href="fresh-cuts/">
        <div class="art">Fresh Cuts</div>
        <div class="about"><strong>Fresh Cuts</strong><span>Slice the fruit flying around the grocer's. Leave the rotten ones alone.</span></div>
      </a>
    </div>
  </body>
</html>
